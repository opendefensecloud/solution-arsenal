# RBAC for the transfer workflow's kubeconfig identity: a ServiceAccount with a
# token secret that can read the source Solar catalog (Components and
# ComponentVersions). The kubeconfig secret assembled by the setup phase points
# at this ServiceAccount's token.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-chaining-access
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: catalog-chaining-solar-reader
rules:
- apiGroups:
  - solar.opendefense.cloud
  resources:
  - components
  - componentversions
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: catalog-chaining-solar-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: catalog-chaining-solar-reader
subjects:
- kind: ServiceAccount
  name: catalog-chaining-access
  namespace: default
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-chaining-access-token
  annotations:
    kubernetes.io/service-account.name: catalog-chaining-access
type: kubernetes.io/service-account-token
