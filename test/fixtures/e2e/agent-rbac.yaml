# What solar-agent may do on the solar cluster
#
# See agent-local-rbac.yaml for what it reads on the cluster it runs on.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent
rules:
  - apiGroups: ["solar.opendefense.cloud"]
    resources: ["targets"]
    verbs: ["get", "list"]
  - apiGroups: ["solar.opendefense.cloud"]
    resources: ["targetreports"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent
subjects:
  - kind: ServiceAccount
    name: agent
roleRef:
  kind: Role
  name: agent
  apiGroup: rbac.authorization.k8s.io
