# What solar-agent reads on the cluster it runs on
#
# Nodes are cluster-scoped and pods are counted across all namespaces, so the
# capacity half is a ClusterRole. The Flux half is a Role in the namespace the
# agent watches (AGENT_NAMESPACE here, the chart's default).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: solar-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: solar-agent
rules:
  # capacity
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: solar-agent
subjects:
  - kind: ServiceAccount
    name: solar-agent
    namespace: AGENT_NAMESPACE
roleRef:
  kind: ClusterRole
  name: solar-agent
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: solar-agent-flux
  namespace: AGENT_NAMESPACE
rules:
  # release status -- both halves of the pair the bootstrap chart creates
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["ocirepositories"]
    verbs: ["list"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: solar-agent-flux
  namespace: AGENT_NAMESPACE
subjects:
  - kind: ServiceAccount
    name: solar-agent
    namespace: AGENT_NAMESPACE
roleRef:
  kind: Role
  name: solar-agent-flux
  apiGroup: rbac.authorization.k8s.io
