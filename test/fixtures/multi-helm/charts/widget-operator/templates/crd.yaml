{{- if .Values.crds.enabled }}
# In templates/, not crds/, as the CloudNativePG and cert-manager charts do: the
# CRD is then upgraded and removed with the release.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.multi-helm.solar.opendefense.cloud
spec:
  group: multi-helm.solar.opendefense.cloud
  scope: Namespaced
  names:
    kind: Widget
    plural: widgets
    singular: widget
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: integer
{{- end }}
