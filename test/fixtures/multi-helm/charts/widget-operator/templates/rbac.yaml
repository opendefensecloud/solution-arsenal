apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-widget-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-widget-operator
rules:
  - apiGroups: [multi-helm.solar.opendefense.cloud]
    resources: [widgets]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-widget-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-widget-operator
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-widget-operator
    namespace: {{ .Release.Namespace }}
