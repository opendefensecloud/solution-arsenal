apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-widget-instance
  labels:
    app.kubernetes.io/name: widget-instance
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: widget-instance
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: widget-instance
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: instance
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
