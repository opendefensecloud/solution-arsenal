fullnameOverride: solar

commonLabels:
  trust: enabled

apiserver:
  image:
    repository: localhost/local/solar-apiserver

controller:
  image:
    repository: localhost/local/solar-controller-manager
  # The agent runs in the same kind cluster, so it reaches the apiserver in-cluster.
  agent:
    apiserverURL: https://kubernetes.default.svc

caBundle:
  enabled: true
  configMapName: root-bundle

renderer:
  image:
    repository: localhost/local/solar-renderer
  caConfigMap: root-bundle
