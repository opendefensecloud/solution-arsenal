{{- if and .Values.apiserver.enabled .Values.rbac.create }}
# Lets the holder opt a Release into receiving its Target's agent credential
# (annotation solar.opendefense.cloud/target-credential). Bound to nobody: bind
# it per namespace to the Solar Operator, see docs/developer-guide/roles.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "solar.fullname" . }}-target-credential-injector
  labels:
    {{- include "solar.labels" . | nindent 4 }}
rules:
  - apiGroups: ["solar.opendefense.cloud"]
    resources: ["releases"]
    verbs: ["inject-target-credential"]
{{- end }}
