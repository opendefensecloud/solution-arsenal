{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "solar-agent.fullname" . }}
  labels:
    {{- include "solar-agent.labels" . | nindent 4 }}
rules:
  # capacity
  - apiGroups:
      - ""
    resources:
      - nodes
      - pods
    verbs:
      - list
  # release status -- both halves of the pair the bootstrap chart creates
  - apiGroups:
      - source.toolkit.fluxcd.io
    resources:
      - ocirepositories
    verbs:
      - list
  - apiGroups:
      - helm.toolkit.fluxcd.io
    resources:
      - helmreleases
    verbs:
      - list
{{- end }}
