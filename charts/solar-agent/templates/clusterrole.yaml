{{- if .Values.rbac.create -}}
# Capacity: nodes are cluster-scoped and pods are counted across all
# namespaces, so this half is cluster-wide. The Flux half is in flux-rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "solar-agent.fullname" . }}
  labels:
    {{- include "solar-agent.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
      - pods
    verbs:
      - list
{{- end }}
