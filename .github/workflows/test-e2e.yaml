name: E2E Tests

on:
  workflow_call:
    inputs:
      image-tag:
        description: "Docker image tag to test"
        required: true
        type: string
      is-local:
        description: "running locally with act, which requires using localhost registry instead of GHCR"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  test-e2e:
    runs-on: ubuntu-24.04
    # Tools (go, kind, kubectl, helm, yq, flux) come from the flake
    # via dev-kit.
    defaults:
      run:
        shell: nix develop --command bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up nix with the shared Cachix cache
        uses: opendefensecloud/dev-kit/.github/actions/setup-nix@6cd9f749d3b2769c8603d0bd77a3ebc23050dfa6 # v3.1.0
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-signing-key: ${{ secrets.CACHIX_SIGNING_KEY }}
      - name: Run E2E Test Suite
        env:
          E2E_IMAGE_SOURCE: ${{ inputs.is-local && 'local' || 'ghcr' }}
          REGISTRY: ${{ inputs.is-local && 'localhost:5001/local' || format('ghcr.io/{0}', github.repository_owner) }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make test-e2e E2E_IMAGE_SOURCE=$E2E_IMAGE_SOURCE TAG=$IMAGE_TAG REGISTRY=$REGISTRY

  test-ui-e2e:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: nix develop --command bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up nix with the shared Cachix cache
        uses: opendefensecloud/dev-kit/.github/actions/setup-nix@6cd9f749d3b2769c8603d0bd77a3ebc23050dfa6 # v3.1.0
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-signing-key: ${{ secrets.CACHIX_SIGNING_KEY }}
      - name: Run UI E2E Test Suite
        env:
          E2E_IMAGE_SOURCE: ${{ inputs.is-local && 'local' || 'ghcr' }}
          REGISTRY: ${{ inputs.is-local && 'localhost:5001/local' || format('ghcr.io/{0}', github.repository_owner) }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make ui-test-e2e E2E_IMAGE_SOURCE=$E2E_IMAGE_SOURCE TAG=$IMAGE_TAG REGISTRY=$REGISTRY
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  chaining-test-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The catalog-chaining e2e provisions its own kind cluster and runs the
    # transfer scenario between two Solar instances via ARC/Argo. Like the Go
    # e2e, it pulls the CI-built images from GHCR when not running with act.
    defaults:
      run:
        shell: nix develop --command bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up nix with the shared Cachix cache
        uses: opendefensecloud/dev-kit/.github/actions/setup-nix@6cd9f749d3b2769c8603d0bd77a3ebc23050dfa6 # v3.1.0
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-signing-key: ${{ secrets.CACHIX_SIGNING_KEY }}
      - name: Run Catalog Chaining E2E Test Suite
        env:
          E2E_IMAGE_SOURCE: ${{ inputs.is-local && 'local' || 'ghcr' }}
          REGISTRY: ${{ inputs.is-local && 'localhost:5001/local' || format('ghcr.io/{0}', github.repository_owner) }}
          IMAGE_TAG: ${{ inputs.image-tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make chaining-test-e2e E2E_IMAGE_SOURCE=$E2E_IMAGE_SOURCE TAG=$IMAGE_TAG REGISTRY=$REGISTRY
