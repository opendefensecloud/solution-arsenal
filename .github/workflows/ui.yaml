name: UI CI
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [labeled, unlabeled, opened, synchronize, reopened]

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            frontend:
              - 'web/**'
              - '.github/workflows/ui.yaml'
              - 'flake.lock'
              - 'flake.nix'
              - 'Makefile'
  lint-test:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'push'
    # Node and pnpm come from the flake. pnpm installs with a frozen lockfile
    # when it detects CI, so a stale pnpm-lock.yaml fails here.
    defaults:
      run:
        shell: nix develop --command bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up nix with the shared Cachix cache
        uses: opendefensecloud/dev-kit/.github/actions/setup-nix@6cd9f749d3b2769c8603d0bd77a3ebc23050dfa6 # v3.1.0
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-signing-key: ${{ secrets.CACHIX_SIGNING_KEY }}
      - name: lint
        run: make ui-lint
      - name: test
        run: make ui-test
