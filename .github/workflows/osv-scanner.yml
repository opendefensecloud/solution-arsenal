name: OSV-Scanner
on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "12 12 * * 1"
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  osv-scanner:
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: opendefensecloud/dev-kit/.github/workflows/osv-scanner.yml@e6fa735852126c9f6b6d4eb4c97c4ba48587b4a5 # v3.0.3
    with:
      scan-args: |-
        --include-git-root
        --config ./.osv-scanner.toml
        -r
        ./
