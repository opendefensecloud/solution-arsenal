name: OSV-Scanner
on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "12 12 * * 1"
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  osv-scanner:
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: opendefensecloud/dev-kit/.github/workflows/osv-scanner.yml@2190eb1fe1dd353a97a63c65bfbdf41e8d1e0147 # v3.0.1
    with:
      scan-args: |-
        --include-git-root
        --config ./.osv-scanner.toml
        -r
        ./
