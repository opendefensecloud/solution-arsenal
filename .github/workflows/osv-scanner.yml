name: OSV-Scanner
on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "12 12 * * 1"
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  osv-scanner:
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: opendefensecloud/dev-kit/.github/workflows/osv-scanner.yml@bd720533e533df5b0dfbe29ba64508b4c3423b7a # v3.0.2
    with:
      scan-args: |-
        --include-git-root
        --config ./.osv-scanner.toml
        -r
        ./
