name: OSV-Scanner
on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "12 12 * * 1"
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  osv-scanner:
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: opendefensecloud/dev-kit/.github/workflows/osv-scanner.yml@66e0c82ff85c5c73a090c5743ed1573629053c5c # v5.1.0
    with:
      scan-args: |-
        --include-git-root
        --config ./.osv-scanner.toml
        -r
        ./
