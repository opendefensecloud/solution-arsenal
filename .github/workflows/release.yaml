name: Release
run-name: ${{ inputs.retry_assets_for && format('Retry assets {0}', inputs.retry_assets_for) || format('Release {0}{1}', inputs.version || '(auto)', inputs.dry_run && ' (dry run)' || '') }}

# Decision 1 of 2: this creates or updates the draft release (and optionally
# its tag). Decision 2 of 2: you publish the draft, which fires docker / helm /
# docs. A push to main keeps the draft current; it never tags or publishes.
# Version and notes are computed by dev-kit's reusable workflow; this
# repository only keeps the triggers and the release-asset build.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.4.0. Leave empty and it is computed from the commits.'
        required: false
        type: string
      dry_run:
        description: 'Render the version and notes only. Do not create or update a release, or create a tag.'
        required: false
        type: boolean
        default: true
      force:
        description: 'Release even though commits are missing from the notes. Recovery only.'
        required: false
        type: boolean
        default: false
      retry_assets_for:
        description: 'Recovery only. Tag of an existing DRAFT release whose asset upload failed. Skips version and notes. Uncheck dry_run.'
        required: false
        type: string
      create_tag:
        description: 'Create the release tag now instead of when the draft is published. Leave unchecked to only update the draft.'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Two releases at once would race to create or update the same draft and tag.
  # Never cancel a run in flight: it may already have tagged and drafted.
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Compute version and notes
    # FIXME: Use released version
    uses: opendefensecloud/dev-kit/.github/workflows/release.yml@100add157bfa01bc2e8f600951b37687afb4f672 # v0.0.0
    permissions:
      contents: write # create/update the draft release and, if requested, the tag
    with:
      # A push keeps the draft up to date; it never tags or publishes. The
      # `inputs` context is empty on push, so each value is selected by the
      # event and still has the declared type.
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      force: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
      retry_assets_for: ${{ github.event_name == 'workflow_dispatch' && inputs.retry_assets_for || '' }}
      create_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.create_tag }}

  assets:
    name: Build and attach release assets
    needs: release
    # result == 'success' matters: validation of a retry target happens in the
    # called workflow, and always() alone would still start this job when it
    # failed. draft_updated is empty on the retry path, so the retry input
    # covers that case.
    if: ${{ always() && needs.release.result == 'success' && (needs.release.outputs.draft_updated == 'true' || inputs.retry_assets_for != '') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write # upload assets to the draft release
      id-token: write # keyless cosign sign-blob
      attestations: write # build-provenance attestation
    env:
      VERSION: ${{ inputs.retry_assets_for || needs.release.outputs.version }}
    steps:
      # A draft cut without create_tag has no git tag yet, so the retry cannot
      # check out its tag name. Resolve the commit the draft targets instead.
      - name: Resolve the draft's commit for asset retry
        id: retry
        if: ${{ inputs.retry_assets_for != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.retry_assets_for }}
        run: |
          set -euo pipefail

          sha=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --json targetCommitish --jq '.targetCommitish')

          if [ -z "$sha" ] || [ "$sha" = "null" ]; then
            echo "::error::Could not resolve the target commit of draft release ${VERSION}."
            exit 1
          fi

          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # By SHA to avoid racing on tag propagation. The retry path has no
          # prepare output, so it uses the draft's resolved target commit.
          ref: ${{ needs.release.outputs.sha || steps.retry.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Extract go version from flake.nix
        id: get-go-version
        run: |
          GO_VERSION="$(sed -nE 's/^[[:space:]]*goVersion[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)";[[:space:]]*$/\1/p' flake.nix)"
          if [ "$(printf '%s\n' "$GO_VERSION" | sed '/^$/d' | wc -l)" -ne 1 ]; then
            echo "::error::Expected exactly one goVersion assignment in flake.nix"
            exit 1
          fi
          echo "version=$GO_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.get-go-version.outputs.version }}
          cache: true

      - name: Run tests
        run: make test

      - name: Build binaries
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildTime=${BUILD_TIME}"

          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/solar-apiserver-linux-amd64 ./cmd/solar-apiserver
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/solar-controller-manager-linux-amd64 ./cmd/solar-controller-manager
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/solar-discovery-linux-amd64 ./cmd/solar-discovery
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/solar-renderer-linux-amd64 ./cmd/solar-renderer

          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o bin/solar-apiserver-linux-arm64 ./cmd/solar-apiserver
          GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o bin/solar-controller-manager-linux-arm64 ./cmd/solar-controller-manager
          GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o bin/solar-discovery-linux-arm64 ./cmd/solar-discovery
          GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o bin/solar-renderer-linux-arm64 ./cmd/solar-renderer

          # Darwin amd64
          GOOS=darwin GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/solar-apiserver-darwin-amd64 ./cmd/solar-apiserver
          GOOS=darwin GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/solar-controller-manager-darwin-amd64 ./cmd/solar-controller-manager
          GOOS=darwin GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/solar-discovery-darwin-amd64 ./cmd/solar-discovery
          GOOS=darwin GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/solar-renderer-darwin-amd64 ./cmd/solar-renderer

          # Darwin arm64
          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o bin/solar-apiserver-darwin-arm64 ./cmd/solar-apiserver
          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o bin/solar-controller-manager-darwin-arm64 ./cmd/solar-controller-manager
          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o bin/solar-discovery-darwin-arm64 ./cmd/solar-discovery
          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o bin/solar-renderer-darwin-arm64 ./cmd/solar-renderer

      - name: Create checksums
        run: |
          # bin/ is also the Makefile's LOCALBIN, so it holds tool binaries and an
          # envtest bin/k8s/ directory after `make test`. Only ship solar-<os>-<arch>.
          # %P strips the leading ./ so the file records basenames. Assets are
          # downloaded flat, and a bin/ prefix makes `sha256sum -c` fail.
          cd bin
          find . -maxdepth 1 -type f -name 'solar-*-*' -printf '%P\n' | sort | xargs sha256sum > checksums.txt

      - name: Attest build provenance
        # actions/attest defaults to SLSA build provenance when no sbom-path or
        # predicate input is given.
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'bin/solar-*-*' # binaries only; runs before signing so .sig/.pem are not yet present

      - name: Keep the provenance as a release asset
        # The step above only writes to GitHub's attestation store. OpenSSF
        # Scorecard's Signed-Releases check detects provenance by filename and
        # never looks there, so ship the same bundle as *.intoto.jsonl. Its own
        # directory keeps it out of the bin/solar-*-* globs, which an rc tag
        # would otherwise match, and it would be signed and uploaded twice.
        # Verify with:
        # gh attestation verify <binary> --repo opendefensecloud/solution-arsenal \
        #   --bundle solar-<tag>.intoto.jsonl
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          mkdir -p provenance
          cp "${BUNDLE}" "provenance/solar-${VERSION}.intoto.jsonl"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artefacts (keyless)
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cd bin
          for f in solar-*-* checksums.txt; do
            # Emit a Sigstore bundle (signature + cert + Rekor proof), named
            # *.sigstore.json so OpenSSF Scorecard's Signed-Releases check
            # detects it. Don't revert to --output-signature/--output-certificate:
            # those are deprecated and silently ignored by newer cosign, which
            # defaults to the bundle format and requires --bundle.
            cosign sign-blob --yes \
              --new-bundle-format=true \
              --bundle "${f}.sigstore.json" \
              "$f"
          done

      - name: Upload assets to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --clobber keeps re-runs idempotent when assets were already
          # partially uploaded
          gh release upload "${VERSION}" bin/solar-*-* bin/checksums.txt* provenance/*.intoto.jsonl \
            --repo "${GITHUB_REPOSITORY}" --clobber
