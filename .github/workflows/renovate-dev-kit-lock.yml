name: Relock dev-kit
on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  relock:
    uses: opendefensecloud/dev-kit/.github/workflows/renovate-dev-kit-lock.yml@2190eb1fe1dd353a97a63c65bfbdf41e8d1e0147 # v3.0.1
    secrets:
      DEV_KIT_BOT_APP_CLIENT_ID: ${{ secrets.DEV_KIT_BOT_APP_CLIENT_ID }}
      DEV_KIT_BOT_APP_PRIVATE_KEY: ${{ secrets.DEV_KIT_BOT_APP_PRIVATE_KEY }}
