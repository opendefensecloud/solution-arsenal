name: Release Please

on:
  push:
    branches:
      - main
  # Manual re-run of release-assets against an existing draft release. The push
  # path only fires that job on the release commit itself, so a failed asset
  # upload is otherwise unrecoverable without deleting the tag and release.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to (re)build and attach assets for, e.g. v0.3.0
        required: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      # write permission is required to create the release and tag
      contents: write
      # write permission is required to label the release PR (labels go
      # through the Issues API)
      issues: write
      # write permission is required to maintain the release PR
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # Mint a short-lived installation token from the release-please GitHub App
      # so the Release PR is opened by the App and not the default GITHUB_TOKEN.
      # PRs opened with GITHUB_TOKEN do not trigger CI, so required checks would
      # never run on the Release PR. The App must be installed on this repo with
      # contents + pull-requests + issues (labels) write. Configure the App ID as
      # the RELEASE_PLEASE_APP_ID repo variable and the private key as the
      # RELEASE_PLEASE_APP_PRIVATE_KEY secret.
      #
      # Gate on BOTH credentials: secrets cannot be used in `if:`, so surface a
      # boolean from an env-backed check. If either is missing we skip the App
      # and fall back to GITHUB_TOKEN, rather than running create-github-app-token
      # with an empty private-key (which fails the whole job).
      - name: Check release-please app config
        id: app-config
        env:
          APP_ID: ${{ vars.RELEASE_PLEASE_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate release-please app token
        id: app-token
        if: ${{ steps.app-config.outputs.configured == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

  release-assets:
    name: Build and attach release assets
    needs: release-please
    # always(): on workflow_dispatch the release-please job is skipped, which
    # would otherwise skip this one too.
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    permissions:
      # write permission is required to upload assets to the draft release
      contents: write
      id-token: write # for keyless cosign sign-blob
      attestations: write # for build-provenance attestation
    env:
      VERSION: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Immutable releases forbid uploading assets to an already-published
          # release, so release-please creates a draft release (with its tag
          # already pushed via force-tag-creation). Check out the release
          # commit by SHA to avoid racing on tag propagation. Publishing the
          # draft (explicit human decision) makes the release immutable and
          # triggers the docker/helm/docs release workflows.
          ref: ${{ inputs.tag || needs.release-please.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Extract go version from flake.nix
        id: get-go-version
        run: |
          GO_VERSION="$(sed -nE 's/^[[:space:]]*goVersion[[:space:]]*=[[:space:]]*"([0-9]+\.[0-9]+\.[0-9]+)";[[:space:]]*$/\1/p' flake.nix)"
          if [ "$(printf '%s\n' "$GO_VERSION" | sed '/^$/d' | wc -l)" -ne 1 ]; then
            echo "::error::Expected exactly one goVersion assignment in flake.nix"
            exit 1
          fi
          echo "version=$GO_VERSION" >> $GITHUB_OUTPUT

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ steps.get-go-version.outputs.version }}
          cache: true

      - name: Run tests
        run: make test

      - name: Build binaries
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildTime=${BUILD_TIME}"

          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/solar-apiserver-linux-amd64 ./cmd/solar-apiserver
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/solar-controller-manager-linux-amd64 ./cmd/solar-controller-manager
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/solar-discovery-linux-amd64 ./cmd/solar-discovery
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/solar-renderer-linux-amd64 ./cmd/solar-renderer

          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o bin/solar-apiserver-linux-arm64 ./cmd/solar-apiserver
          GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o bin/solar-controller-manager-linux-arm64 ./cmd/solar-controller-manager
          GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o bin/solar-discovery-linux-arm64 ./cmd/solar-discovery
          GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o bin/solar-renderer-linux-arm64 ./cmd/solar-renderer

          # Darwin amd64
          GOOS=darwin GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/solar-apiserver-darwin-amd64 ./cmd/solar-apiserver
          GOOS=darwin GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/solar-controller-manager-darwin-amd64 ./cmd/solar-controller-manager
          GOOS=darwin GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/solar-discovery-darwin-amd64 ./cmd/solar-discovery
          GOOS=darwin GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o bin/solar-renderer-darwin-amd64 ./cmd/solar-renderer

          # Darwin arm64
          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o bin/solar-apiserver-darwin-arm64 ./cmd/solar-apiserver
          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o bin/solar-controller-manager-darwin-arm64 ./cmd/solar-controller-manager
          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o bin/solar-discovery-darwin-arm64 ./cmd/solar-discovery
          GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o bin/solar-renderer-darwin-arm64 ./cmd/solar-renderer

      - name: Create checksums
        run: |
          # bin/ is also the Makefile's LOCALBIN, so it holds tool binaries and an
          # envtest bin/k8s/ directory after `make test`. Only ship solar-<os>-<arch>.
          find bin -maxdepth 1 -type f -name 'solar-*-*' | sort | xargs sha256sum > bin/checksums.txt

      - name: Attest build provenance
        # actions/attest defaults to SLSA build provenance when no sbom-path or
        # predicate input is given.
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'bin/solar-*-*' # binaries only; runs before signing so .sig/.pem are not yet present

      - name: Keep the provenance as a release asset
        # The step above only writes to GitHub's attestation store. OpenSSF
        # Scorecard's Signed-Releases check detects provenance by filename and
        # never looks there, so ship the same bundle as *.intoto.jsonl. Verify
        # with: gh attestation verify <binary> --bundle solar-<tag>.intoto.jsonl
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "${BUNDLE}" "bin/solar-${VERSION}.intoto.jsonl"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release artefacts (keyless)
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cd bin
          for f in solar-*-* checksums.txt; do
            # Emit a Sigstore bundle (signature + cert + Rekor proof), named
            # *.sigstore.json so OpenSSF Scorecard's Signed-Releases check
            # detects it. Don't revert to --output-signature/--output-certificate:
            # those are deprecated and silently ignored by newer cosign, which
            # defaults to the bundle format and requires --bundle.
            cosign sign-blob --yes \
              --new-bundle-format=true \
              --bundle "${f}.sigstore.json" \
              "$f"
          done

      - name: Upload assets to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --clobber keeps re-runs idempotent when assets were already
          # partially uploaded
          gh release upload "${VERSION}" bin/solar-*-* bin/checksums.txt* bin/*.intoto.jsonl \
            --repo "${GITHUB_REPOSITORY}" --clobber
