name: Codegen Check
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: nix develop --command bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up nix with the shared Cachix cache
        uses: opendefensecloud/dev-kit/.github/actions/setup-nix@ff7dfec210333b1ecd626ded75f635081149a6c6 # v3.1.1
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-signing-key: ${{ secrets.CACHIX_SIGNING_KEY }}
      - name: Run codegen
        run: |
          make codegen
      - name: Tidy go modules
        run: |
          go mod tidy
      - name: Check for changes
        uses: opendefensecloud/dev-kit/.github/actions/diff-check@ff7dfec210333b1ecd626ded75f635081149a6c6 # v3.1.1
