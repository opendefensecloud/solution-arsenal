name: Helm Lint
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    paths:
      - "charts/**"
      - ".github/workflows/helm-lint.yaml"
  pull_request:
    branches: [main, develop]
    paths:
      - "charts/**"
      - ".github/workflows/helm-lint.yaml"

jobs:
  lint:
    runs-on: ubuntu-26.04
    # helm comes from the flake via dev-kit.
    defaults:
      run:
        shell: nix develop --command bash -e {0}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up nix with the shared Cachix cache
        uses: opendefensecloud/dev-kit/.github/actions/setup-nix@6cd9f749d3b2769c8603d0bd77a3ebc23050dfa6 # v3.1.0
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cachix-signing-key: ${{ secrets.CACHIX_SIGNING_KEY }}

      - name: Lint Helm charts
        run: |
          for chart in charts/*/; do
            if [ -f "${chart}Chart.yaml" ]; then
              echo "Linting chart: ${chart}"
              helm lint "${chart}"
            fi
          done

      - name: Template Helm charts
        run: |
          for chart in charts/*/; do
            if [ -f "${chart}Chart.yaml" ]; then
              echo "Templating chart: ${chart}"
              helm template test "${chart}"
            fi
          done

      - name: Template Helm charts with CI values
        run: |
          set -o pipefail
          for values in charts/*/ci/*-values.yaml; do
            [ -f "${values}" ] || continue
            chart="${values%%/ci/*}"
            echo "Templating chart: ${chart} with ${values}"
            # A lost document separator merges resources into one document
            # instead of failing to parse, so assert the resource count rather
            # than just rendering successfully.
            expected="$(yq '.registries // [] | length' "${values}")"
            actual="$(helm template test "${chart}" -f "${values}" \
              | yq -N 'select(.kind == "Registry") | .metadata.name' | wc -l | tr -d ' ')"
            if [ "${expected}" -ne "${actual}" ]; then
              echo "Expected ${expected} Registry resources, got ${actual}" >&2
              exit 1
            fi
          done
