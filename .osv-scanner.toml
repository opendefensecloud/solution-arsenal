# golang.org/x/crypto/openpgp is unmaintained and deprecated upstream. This is a
# "do not use this package" advisory rather than a specific exploitable defect:
# all versions are affected and no fixed release will ever exist, so no
# dependency bump clears it.
#
# We do not import it. Single transitive path (verified via `go mod why`):
#   pkg/discovery
#     -> ocm.software/ocm/api/ocm/extensions/accessmethods/github
#     -> github.com/google/go-github/v45/github
#     -> golang.org/x/crypto/openpgp
#
# The importer is OCM's pin of go-github v45. v45 -> v88 is a major-version
# module path change, so we cannot bump it from here; OCM must migrate. Note
# go-github/v88 is already in our graph (via cosign) and does not pull openpgp,
# so the upstream fix is a straight migration.
#
# Remove once OCM moves accessmethods/github off go-github v45.
[[IgnoredVulns]]
id = "GO-2026-5932"
ignoreUntil = 2027-02-19
reason = "Deprecated-package advisory with no fix; only reachable via OCM's go-github v45 pin, which we cannot bump from here"
