{{- $name := printf "%s-%s" $.Release.Name $.Values.component.name }}
{{- if gt (len $name) 53 }}
  {{- $sha := $name | sha256sum | trunc 10 }}
  {{- $name = printf "%s-%s" ($name | trunc 42) $sha }}
{{- end }}

{{- $componentLabel := $.Values.component.name }}
{{- if gt (len $componentLabel) 63 }}
  {{- $sha := $componentLabel | sha256sum | trunc 10 }}
  {{- $componentLabel = printf "%s-%s" ($componentLabel | trunc 52) $sha }}
{{- end }}

{{- $epName := .Values.entrypoint.resourceName }}
{{- if not (hasKey .Values.resources $epName) }}
  {{- fail (printf "entrypoint resource %q not found in .Values.resources" $epName) }}
{{- end }}
{{- $resource := index .Values.resources $epName }}
{{- if not $resource.repository }}
  {{- fail (printf "resource %q has empty repository" $epName) }}
{{- end }}
{{- if not $resource.tag }}
  {{- fail (printf "resource %q has empty tag" $epName) }}
{{- end }}
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: {{ $name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    solar.opendefense.cloud/component: {{ $componentLabel | quote }}
  annotations:
    solar.opendefense.cloud/component: {{ $.Values.component.name | quote }}
spec:
  interval: 4m
  url: {{ printf "oci://%s" $resource.repository | quote }}
  {{- if $resource.insecure }}
  insecure: true
  {{- end }}
  {{- if $resource.pullSecretName }}
  secretRef:
    name: {{ $resource.pullSecretName | quote }}
  {{- end }}
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
  ref:
    {{- if hasPrefix "@" $resource.tag }}
    digest: {{ trimPrefix "@" $resource.tag | quote }}
    {{- else }}
    tag: {{ $resource.tag | quote }}
    {{- end }}
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ $name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    solar.opendefense.cloud/component: {{ $componentLabel | quote }}
  annotations:
    solar.opendefense.cloud/component: {{ $.Values.component.name | quote }}
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: {{ $name | quote }}
  releaseName: {{ $name | quote }}
  install:
    remediation:
      retries: 3
    {{- if .Values.solar.targetNamespace }}
    createNamespace: true
    {{- end }}
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
  {{- with .Values.solar.targetNamespace }}
  targetNamespace: {{ . | quote }}
  {{- end }}
  {{- if or .Values.solar.renderedValues .Values.solar.agentValues }}
  valuesFrom:
    {{- if .Values.solar.renderedValues }}
    - kind: ConfigMap
      name: {{ printf "%s-values" $name | quote }}
      valuesKey: values.yaml
    {{- end }}
    {{- if .Values.solar.agentValues }}
    - kind: Secret
      name: {{ printf "%s-agent" $name | quote }}
      valuesKey: values.yaml
    {{- end }}
  {{- end }}
  values:
    {{- toYaml .Values.solar.values | nindent 4 }}
{{- if .Values.solar.renderedValues }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-values" $name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    solar.opendefense.cloud/component: {{ $componentLabel | quote }}
data:
  values.yaml: {{ .Values.solar.renderedValues | quote }}
{{- end }}
{{- if .Values.solar.agentValues }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-agent" $name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    solar.opendefense.cloud/component: {{ $componentLabel | quote }}
type: Opaque
stringData:
  values.yaml: {{ printf "%swatchNamespace: %q\n" .Values.solar.agentValues .Release.Namespace | quote }}
{{- end }}
